<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none" />
  <title>PDF 簽名系統 - 賈伯斯穩定修復版 🦞</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.6/dist/signature_pad.umd.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; background-color: #f0f2f5; margin: 0; }
    .header { background: white; padding: 10px 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
    h2 { margin: 0; color: #007bff; font-size: 1.1em; }
    
    #pdf-container { 
      max-height: 65vh; overflow: auto; background: #99a; padding: 15px; margin: 10px 0;
      display: block; text-align: center; border-radius: 8px;
    }
    
    .pdf-page { position: relative; display: inline-block; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); background: white; }
    canvas { display: block; max-width: 100%; height: auto; }
    
    .signature-img {
      position: absolute; width: 150px; height: auto; touch-action: none; cursor: move; z-index: 100;
      transform-origin: center center; border: 2px solid transparent; user-select: none;
    }
    .signature-img.selected { border: 2px dashed #007bff; background: rgba(0,123,255,0.1); }
    
    .controls { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee; }
    #signature-pad { width: 100%; height: 180px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button { padding: 10px 14px; border: none; border-radius: 8px; color: white; background: #007bff; font-weight: bold; cursor: pointer; }
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    
    .tool-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
    .tool-btn { width: 40px; height: 40px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; font-size: 18px; color: #333; }
    
    #line-alert { display: none; background: #fff3cd; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; border: 1px solid #ffeeba; color: #856404; }
    .status { font-size: 12px; color: #666; }
  </style>
</head>
<body onclick="deselectAll(event)">

<div class="header">
  <h2>PDF 簽名系統 <small>優化版 🦞</small></h2>
  <div id="load-status" class="status">等待上傳</div>
</div>

<div id="line-alert"></div>

<div class="controls">
  <input type="file" id="pdf-upload" accept="application/pdf,image/*" />
</div>

<div id="pdf-container"></div>

<div class="controls">
  <div class="tool-row">
    <label>簽名顏色:</label>
    <input type="color" id="color-picker" value="#000000" />
    <button class="secondary" onclick="clearPad()">清除</button>
  </div>
  <canvas id="signature-pad"></canvas>
  <button style="width: 100%; margin-top: 10px;" onclick="addSignature()">✨ 產生簽名圖片</button>
</div>

<div class="controls" id="edit-panel">
  <div class="tool-row">
    <span>縮放:</span>
    <button class="tool-btn" onclick="adjustSize(1.1)">➕</button>
    <button class="tool-btn" onclick="adjustSize(0.9)">➖</button>
    <span style="font-size: 11px; color: #999;">(支援滾輪/雙指)</span>
  </div>
  <div class="tool-row">
    <span>旋轉:</span>
    <button class="tool-btn" onclick="adjustRotate(-15)">↺</button>
    <button class="tool-btn" onclick="adjustRotate(15)">↻</button>
    <button class="secondary" style="padding: 5px 10px;" onclick="resetRotate()">重置</button>
  </div>
  <button class="danger" style="width: 100%;" onclick="removeSelected()">🗑️ 刪除選中簽名</button>
</div>

<div class="controls">
  <div class="btn-group">
    <button class="success" style="flex: 1;" onclick="exportPDF()">📥 下載 PDF</button>
    <button style="background: #17a2b8; flex: 1;" onclick="exportJPG()">🖼️ 下載 JPG</button>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

// LINE 偵測
if (navigator.userAgent.toLowerCase().indexOf("line") !== -1) {
  const box = document.getElementById('line-alert');
  box.style.display = "block";
  box.innerHTML = "⚠️ 偵測到 LINE 瀏覽器！請選「使用預設瀏覽器開啟」以確保下載。";
}

const padCvs = document.getElementById('signature-pad');
const colorPkr = document.getElementById('color-picker');
let sigPad;

function initPad() {
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  padCvs.width = padCvs.offsetWidth * ratio;
  padCvs.height = padCvs.offsetHeight * ratio;
  padCvs.getContext("2d").scale(ratio, ratio);
  sigPad = new SignaturePad(padCvs, { backgroundColor: 'rgba(0,0,0,0)', minWidth: 1.5, maxWidth: 3.5, penColor: colorPkr.value });
}
window.addEventListener("resize", initPad);
initPad();
colorPkr.oninput = () => { if (sigPad) sigPad.penColor = colorPkr.value; };

let pdfBytes = null;
let curPage = 1;
let sigs = []; 
let activeSig = null;
let count = 0;

function loadImage(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }

document.getElementById("pdf-upload").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("load-status");
  const container = document.getElementById("pdf-container");
  status.textContent = "⏳ 載入中...";
  container.innerHTML = '';
  sigs = []; activeSig = null;

  try {
    if (file.type === "application/pdf") {
      pdfBytes = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(pdfBytes) }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: 1.5 });
        const cvs = document.createElement("canvas");
        cvs.width = vp.width; cvs.height = vp.height;
        await page.render({ canvasContext: cvs.getContext("2d"), viewport: vp }).promise;
        const wrap = document.createElement("div");
        wrap.className = "pdf-page"; wrap.dataset.page = i; wrap.style.width = vp.width + "px";
        wrap.appendChild(cvs);
        wrap.onclick = (ev) => { curPage = i; status.textContent = `📍 第 ${i} 頁`; ev.stopPropagation(); };
        container.appendChild(wrap);
      }
      status.textContent = `✅ 共 ${pdf.numPages} 頁`;
    } else if (file.type.startsWith("image/")) {
      const img = await loadImage(URL.createObjectURL(file));
      const cvs = document.createElement("canvas");
      cvs.width = img.width; cvs.height = img.height;
      cvs.getContext("2d").drawImage(img, 0, 0);
      const wrap = document.createElement("div");
      wrap.className = "pdf-page"; wrap.dataset.page = 1; wrap.style.width = Math.min(img.width, 800) + "px";
      wrap.appendChild(cvs);
      wrap.onclick = () => { curPage = 1; };
      container.appendChild(wrap);
      pdfBytes = null;
      status.textContent = "✅ 圖片載入完成";
    }
  } catch (err) { alert(err.message); status.textContent = "❌ 錯誤"; }
};

function deselectAll(e) {
  if (e && (e.target.closest('.signature-img') || e.target.closest('.controls'))) return;
  document.querySelectorAll(".signature-img").forEach(el => el.classList.remove("selected"));
  activeSig = null;
}

function addSignature() {
  if (sigPad.isEmpty()) { alert("請先簽名！"); return; }
  const wrap = document.querySelector(`.pdf-page[data-page="${curPage}"]`);
  if (!wrap) { alert("請點選文件頁面！"); return; }

  const data = sigPad.toDataURL("image/png");
  const img = document.createElement("img");
  img.src = data; img.className = "signature-img";
  img.style.left = "50px"; img.style.top = "50px";
  
  const obj = { id: count++, page: curPage, el: img, data, scale: 1.0, rotate: 0, baseW: 150 };
  sigs.push(obj);
  wrap.appendChild(img);
  sel(obj);

  // 拖曳與縮放
  let dragging = false, pinching = false, sX, sY, iL, iT, iD, iS;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  img.addEventListener("touchstart", (e) => {
    sel(obj);
    if (e.touches.length === 2) { pinching = true; iD = dist(e.touches); iS = obj.scale; }
    else { dragging = true; sX = e.touches[0].clientX; sY = e.touches[0].clientY; iL = parseInt(img.style.left); iT = parseInt(img.style.top); }
    e.preventDefault(); e.stopPropagation();
  }, { passive: false });

  img.addEventListener("mousedown", (e) => {
    sel(obj); dragging = true; sX = e.clientX; sY = e.clientY; iL = parseInt(img.style.left); iT = parseInt(img.style.top);
    e.preventDefault(); e.stopPropagation();
  });

  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    img.style.left = (iL + e.clientX - sX) + "px";
    img.style.top = (iT + e.clientY - sY) + "px";
  });

  window.addEventListener("touchmove", (e) => {
    if (pinching && e.touches.length === 2) {
      obj.scale = Math.max(0.1, iS * (dist(e.touches) / iD));
      upd(obj);
    } else if (dragging) {
      const p = e.touches[0];
      img.style.left = (iL + p.clientX - sX) + "px";
      img.style.top = (iT + p.clientY - sY) + "px";
    }
  }, { passive: false });

  window.addEventListener("mouseup", () => dragging = false);
  window.addEventListener("touchend", () => { dragging = pinching = false; });
  
  img.addEventListener("wheel", (e) => {
    e.preventDefault();
    obj.scale = Math.max(0.1, obj.scale * (e.deltaY > 0 ? 0.9 : 1.1));
    upd(obj);
  }, { passive: false });

  function sel(s) { deselectAll(); s.el.classList.add("selected"); activeSig = s; }
}

function upd(s) {
  s.el.style.width = (s.baseW * s.scale) + "px";
  s.el.style.transform = `rotate(${s.rotate}deg)`;
}

function adjustSize(f) { if (activeSig) { activeSig.scale *= f; upd(activeSig); } }
function adjustRotate(a) { if (activeSig) { activeSig.rotate = (activeSig.rotate + a) % 360; upd(activeSig); } }
function resetRotate() { if (activeSig) { activeSig.rotate = 0; upd(activeSig); } }
function removeSelected() { if (activeSig) { activeSig.el.remove(); sigs = sigs.filter(s => s.id !== activeSig.id); activeSig = null; } }
function clearPad() { sigPad.clear(); }

async function exportPDF() {
  if (sigs.length === 0) return;
  const status = document.getElementById("load-status");
  status.textContent = "⏳ 產生中...";
  try {
    const doc = pdfBytes ? await PDFLib.PDFDocument.load(pdfBytes) : await PDFLib.PDFDocument.create();
    const pages = doc.getPages();

    for (const s of sigs) {
      const wrap = document.querySelector(`.pdf-page[data-page="${s.page}"]`);
      const canvas = wrap.querySelector("canvas");
      const page = pdfBytes ? pages[s.page - 1] : (pages[0] || doc.addPage([canvas.width, canvas.height]));
      const { width: pW, height: pH } = page.getSize();
      
      const cR = canvas.getBoundingClientRect();
      const iR = s.el.getBoundingClientRect();
      
      // 計算相對於 Canvas 的偏移比 (不管螢幕多大，這比例是固定的)
      const rx = pW / cR.width;
      const ry = pH / cR.height;
      
      // 計算簽名中心點在 PDF 上的座標
      const cx = (iR.left - cR.left + iR.width / 2) * rx;
      const cy = pH - ((iR.top - cR.top + iR.height / 2) * ry);
      
      const dw = iR.width * rx;
      const dh = iR.height * ry;
      const png = await doc.embedPng(s.data);
      
      // 手動計算旋轉後的起始點 (因為 1.17.1 不支援 Anchor)
      const rad = (-s.rotate * Math.PI) / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      const vx = (dw/2) * cos - (dh/2) * sin;
      const vy = (dw/2) * sin + (dh/2) * cos;

      page.drawImage(png, {
        x: cx - vx,
        y: cy - vy,
        width: dw,
        height: dh,
        rotate: PDFLib.degrees(-s.rotate)
      });
    }

    const b = await doc.save();
    const l = document.createElement("a");
    l.href = URL.createObjectURL(new Blob([b], { type: "application/pdf" }));
    l.download = "signed_fixed.pdf"; l.click();
    status.textContent = "✨ 已完成";
  } catch (e) { alert(e.message); status.textContent = "❌ 失敗"; }
}

async function exportJPG() {
  if (sigs.length === 0) return;
  const pNums = [...new Set(sigs.map(s => s.page))];
  for (const n of pNums) {
    const wrap = document.querySelector(`.pdf-page[data-page="${n}"]`);
    const base = wrap.querySelector("canvas");
    const out = document.createElement('canvas');
    out.width = base.width; out.height = base.height;
    const ctx = out.getContext('2d');
    ctx.drawImage(base, 0, 0);

    for (const s of sigs.filter(sig => sig.page === n)) {
      const iR = s.el.getBoundingClientRect(), cR = base.getBoundingClientRect();
      const sx = base.width / cR.width, sy = base.height / cR.height;
      const img = await loadImage(s.data);
      ctx.save();
      ctx.translate((iR.left - cR.left + iR.width/2) * sx, (iR.top - cR.top + iR.height/2) * sy);
      ctx.rotate(s.rotate * Math.PI / 180);
      ctx.drawImage(img, -iR.width/2 * sx, -iR.height/2 * sy, iR.width * sx, iR.height * sy);
      ctx.restore();
    }
    const b = await new Promise(r => out.toBlob(r, "image/jpeg", 0.9));
    const l = document.createElement("a");
    l.href = URL.createObjectURL(b);
    l.download = `signed_page_${n}.jpg`; l.click();
  }
}
</script>
</body>
</html>
