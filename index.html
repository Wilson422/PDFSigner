<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none" />
  <title>PDF 簽名系統 - 賈伯斯回歸版 🦞</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.6/dist/signature_pad.umd.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 10px; background-color: #f8f9fa; margin: 0; }
    #pdf-container { max-height: 550px; overflow-y: auto; border: 2px solid #ccc; border-radius: 8px; background: #99a; padding: 10px; margin-bottom: 20px; text-align: center; }
    .pdf-page { position: relative; margin: 0 auto 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: white; display: inline-block; }
    canvas { display: block; max-width: 100%; height: auto; }
    .signature-img {
      position: absolute; width: 120px; height: auto; touch-action: none; cursor: move; z-index: 1000;
      transform-origin: center center; border: 2px solid transparent; user-select: none;
    }
    .signature-img.selected { border: 2px dashed #007bff; background: rgba(0, 123, 255, 0.1); }
    #signature-pad { width: 100%; height: 200px; border: 1px solid #000; touch-action: none; background: white; }
    button { margin: 5px 5px 5px 0; font-size: 16px; padding: 10px 15px; border-radius: 6px; border: none; background: #007bff; color: white; cursor: pointer; }
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; }
    .controls { margin-bottom: 10px; padding: 10px; background: white; border-radius: 8px; border: 1px solid #ddd; }
    #line-alert { display: none; background: #fffbe6; border: 1px solid #ffd700; color: #d48806; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: center; }
  </style>
</head>
<body onclick="handleBodyClick(event)">

<div id="line-alert"></div>
<h2>PDF 簽名系統 <small style="font-size: 0.6em; color: #666;">穩定回歸版 🦞</small></h2>

<div class="controls">
  <input type="file" id="pdf-upload" accept="application/pdf" />
  <span id="load-status" style="font-size: 12px; color: #666; margin-left: 10px;">等待上傳...</span>
</div>

<div id="pdf-container"></div>

<div class="controls">
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
    <label>簽名顏色：</label>
    <input type="color" id="color-picker" value="#000000" />
    <button class="secondary" onclick="clearPad()">清除畫板</button>
  </div>
  <canvas id="signature-pad"></canvas>
  <button style="width: 100%;" onclick="createSignature()">產生簽名圖片</button>
</div>

<div class="controls" id="edit-controls">
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
    <span>調整選中簽名：</span>
    <button class="secondary" onclick="changeSize(1.2)">➕ 放大</button>
    <button class="secondary" onclick="changeSize(0.8)">➖ 縮小</button>
    <button class="secondary" onclick="changeRotate(15)">↻ 旋轉</button>
  </div>
  <button class="danger" style="width: 100%;" onclick="deleteSig()">🗑️ 刪除選中簽名</button>
</div>

<button style="background: #28a745; width: 100%; padding: 15px;" onclick="signAndDownload()">📥 簽名並下載 PDF</button>

<script>
const { PDFDocument, degrees } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

// LINE 偵測
if (navigator.userAgent.toLowerCase().indexOf("line") !== -1) {
  const box = document.getElementById('line-alert');
  box.style.display = "block";
  box.innerHTML = "偵測到 LINE 瀏覽器，請點擊右上角 [...] 選擇「使用預設瀏覽器開啟」以確保下載正常。";
}

const canvas = document.getElementById('signature-pad');
const colorPicker = document.getElementById('color-picker');
let signaturePad;
let lastW = 0;

function resizePad() {
  // 修正：只有當寬度真正改變（如轉向）才重置，避免手機捲動時清空
  if (Math.abs(canvas.offsetWidth - lastW) < 10) return;
  lastW = canvas.offsetWidth;
  
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const data = signaturePad ? signaturePad.toData() : null;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  canvas.getContext("2d").scale(ratio, ratio);
  signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgba(0,0,0,0)', minWidth: 2, maxWidth: 4, penColor: colorPicker.value });
  if (data) signaturePad.fromData(data);
}
window.addEventListener("resize", resizePad);
resizePad();

colorPicker.oninput = () => { if (signaturePad) signaturePad.penColor = colorPicker.value; };

let pdfOriginalBytes = null;
let curP = 1;
let sigs = []; 
let activeSig = null;
let idCounter = 0;

document.getElementById("pdf-upload").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("load-status");
  const container = document.getElementById("pdf-container");
  status.textContent = "⏳ 載入中...";
  container.innerHTML = ''; sigs = []; activeSig = null;

  try {
    pdfOriginalBytes = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(pdfOriginalBytes) }).promise;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 1.5 });
      const pc = document.createElement("canvas");
      pc.width = vp.width; pc.height = vp.height;
      await page.render({ canvasContext: pc.getContext("2d"), viewport: vp }).promise;

      const wrap = document.createElement("div");
      wrap.className = "pdf-page"; wrap.dataset.page = i; wrap.style.width = vp.width + "px";
      wrap.appendChild(pc);
      wrap.onclick = (ev) => { curP = i; status.textContent = `📍 已選第 ${i} 頁`; ev.stopPropagation(); };
      container.appendChild(wrap);
    }
    status.textContent = `✅ 共 ${pdf.numPages} 頁`;
  } catch (err) { alert(err.message); }
};

function handleBodyClick(e) { if (!e.target.closest('.signature-img') && !e.target.closest('.controls')) deselectAll(); }
function deselectAll() { document.querySelectorAll(".signature-img").forEach(el => el.classList.remove("selected")); activeSig = null; }

function createSignature() {
  if (signaturePad.isEmpty()) return;
  const wrap = document.querySelector(`.pdf-page[data-page="${curP}"]`);
  if (!wrap) { alert("請先點選文件頁面！"); return; }

  const data = signaturePad.toDataURL("image/png");
  const img = document.createElement("img");
  img.src = data; img.className = "signature-img";
  img.style.left = "50px"; img.style.top = "50px";

  const obj = { id: idCounter++, page: curP, el: img, data, rotate: 0, w: 150 };
  sigs.push(obj);
  wrap.appendChild(img);
  sel(obj);

  // 拖曳與縮放邏輯
  let drag = false, pinch = false, sx, sy, il, it, idist, iw;
  const getD = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  const start = (e) => {
    sel(obj);
    const p = e.touches ? e.touches[0] : e;
    if (e.touches && e.touches.length === 2) { pinch = true; drag = false; idist = getD(e.touches); iw = obj.w; }
    else { drag = true; sx = p.clientX; sy = p.clientY; il = parseInt(img.style.left); it = parseInt(img.style.top); }
    e.preventDefault(); e.stopPropagation();
  };

  const move = (e) => {
    if (pinch && e.touches.length === 2) {
      obj.w = Math.max(30, iw * (getD(e.touches) / idist));
      upd(obj);
    } else if (drag) {
      const p = e.touches ? e.touches[0] : e;
      img.style.left = (il + p.clientX - sx) + "px";
      img.style.top = (it + p.clientY - sy) + "px";
    }
  };

  img.addEventListener("touchstart", start, { passive: false });
  img.addEventListener("mousedown", start);
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("mousemove", move);
  window.addEventListener("touchend", () => { drag = pinch = false; });
  window.addEventListener("mouseup", () => drag = false);
  img.addEventListener("wheel", (e) => { e.preventDefault(); obj.w = Math.max(30, obj.w * (e.deltaY > 0 ? 0.9 : 1.1)); upd(obj); }, { passive: false });

  function sel(s) { deselectAll(); s.el.classList.add("selected"); activeSig = s; }
}

function upd(s) {
  s.el.style.width = s.w + "px";
  s.el.style.transform = `rotate(${s.rotate}deg)`;
}

function changeSize(f) { if (activeSig) { activeSig.w *= f; upd(activeSig); } }
function changeRotate(a) { if (activeSig) { activeSig.rotate = (activeSig.rotate + a) % 360; upd(activeSig); } }
function deleteSig() { if (activeSig) { activeSig.el.remove(); sigs = sigs.filter(s => s.id !== activeSig.id); activeSig = null; } }
function clearPad() { signaturePad.clear(); }

// 第一版最穩定的「座標相減」數學邏輯
async function signAndDownload() {
  if (sigs.length === 0) return;
  document.getElementById("load-status").textContent = "⏳ 產出中...";
  try {
    const doc = await PDFDocument.load(pdfOriginalBytes);
    const pages = doc.getPages();

    for (const s of sigs) {
      const page = pages[s.page - 1];
      const { width: pW, height: pH } = page.getSize();
      const pR = page.getRotation().angle;
      
      const wrap = document.querySelector(`.pdf-page[data-page="${s.page}"]`);
      const canvas = wrap.querySelector("canvas");
      const cR = canvas.getBoundingClientRect();
      const iR = s.el.getBoundingClientRect(); // 這個會抓到螢幕上真實的渲染大小與座標
      
      const ratio = pW / cR.width;
      
      // 計算相對於 Canvas 的偏移
      const relX = (iR.left - cR.left) * ratio;
      const relY = (iR.top - cR.top) * ratio;
      const dw = iR.width * ratio;
      const dh = iR.height * ratio;

      const png = await doc.embedPng(s.data);
      
      // 中心點計算
      const cx = relX + dw / 2;
      const cy = pH - (relY + dh / 2); // PDF 是由下往上算

      // 手機掃描 PDF 的旋轉補正
      let fx = cx, fy = cy, fr = s.rotate;
      if (pR === 90) { fx = relY + dh/2; fy = cx; fr -= 90; }
      else if (pR === 180) { fx = pW - cx; fy = relY + dh/2; fr -= 180; }
      else if (pR === 270) { fx = pW - (relY + dh/2); fy = pH - cx; fr -= 270; }

      page.drawImage(png, {
        x: fx, y: fy,
        width: dw, height: dh,
        rotate: degrees(-fr),
        xAnchor: 'center', yAnchor: 'middle'
      });
    }

    const b = await doc.save();
    const l = document.createElement("a");
    l.href = URL.createObjectURL(new Blob([b], { type: "application/pdf" }));
    l.download = "final_signed.pdf"; l.click();
    document.getElementById("load-status").textContent = "✨ 已下載";
  } catch (e) { alert(e.message); }
}
</script>
</body>
</html>
