<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none" />
  <title>PDF 簽名系統 - 賈伯斯大師視覺整合版 🦞</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.6/dist/signature_pad.umd.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root { --primary: #007bff; --panel: #ffffff; --bg: #f8f9fa; }
    body { font-family: -apple-system, sans-serif; padding: 10px; background-color: var(--bg); margin: 0; color: #333; }
    .header { background: var(--panel); padding: 12px 15px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 12px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    h2 { margin: 0; color: var(--primary); font-size: 1.2em; }
    
    #pdf-container { 
      max-height: 60vh; overflow: auto; background: #525659; padding: 20px; margin: 10px 0;
      border-radius: 12px; text-align: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
    }
    
    .page-wrapper { 
      position: relative; margin: 0 auto 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
      background: white; display: inline-block; line-height: 0;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    
    .signature-img {
      position: absolute; width: 150px; height: auto; touch-action: none; cursor: move; z-index: 1000;
      transform-origin: center center; border: 1px dashed rgba(0,0,0,0.1); user-select: none;
    }
    .signature-img.selected { border: 2px dashed var(--primary); background: rgba(0,123,255,0.1); }
    
    .controls { background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .section-title { font-weight: bold; margin-bottom: 10px; color: #444; font-size: 0.95em; }
    
    #signature-pad { width: 100%; height: 180px; border: 1px solid #ddd; border-radius: 8px; background: #fff; touch-action: none; }
    
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    button { padding: 12px 15px; border: none; border-radius: 8px; color: white; background: var(--primary); font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.96); }
    button.secondary { background: #6c757d; }
    button.danger { background: #dc3545; }
    button.success { background: #28a745; }
    
    .tool-btn { min-width: 44px; height: 44px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; font-size: 18px; color: #333; display: flex; align-items: center; justify-content: center; }
    
    #line-alert { display: none; background: #fff3cd; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 13px; color: #856404; border: 1px solid #ffeeba; text-align: center; }
    .status { font-size: 12px; color: #666; }
    .hint { font-size: 11px; color: #999; font-style: italic; margin-top: 5px; }
  </style>
</head>
<body onclick="deselectAll(event)">

<div id="line-alert"></div>
<div class="header">
  <h2>PDF 簽名系統 <small style="font-size: 0.6em; opacity: 0.7;">智慧整合版 🦞</small></h2>
  <div id="load-status" class="status">等待上傳</div>
</div>

<div class="controls">
  <input type="file" id="pdf-upload" accept="application/pdf" style="width: 100%;" />
</div>

<div id="pdf-container"></div>

<div class="controls">
  <div class="section-title">🖊️ 第一步：手寫簽名</div>
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
    <input type="color" id="color-picker" value="#000000" style="width:45px; height:34px; border:none;" />
    <button class="secondary" style="padding: 6px 12px;" onclick="signaturePad.clear()">🧹 清除</button>
  </div>
  <canvas id="signature-pad"></canvas>
  <button style="width: 100%; margin-top: 10px;" onclick="addSig()">✨ 放入簽名圖片</button>
</div>

<div class="controls" id="edit-bar" style="display:none;">
  <div class="section-title">📐 第二步：調整簽名</div>
  <div class="tool-row" style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
    <span>縮放:</span>
    <button class="tool-btn" onclick="adjustSize(1.2)">➕</button>
    <button class="tool-btn" onclick="adjustSize(0.8)">➖</button>
    <span class="hint">(電腦支援滾輪 / 手機支援雙指)</span>
  </div>
  <div class="tool-row" style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
    <span>旋轉:</span>
    <button class="tool-btn" onclick="rotateSig(90)">↻ 90°</button>
    <button class="tool-btn" onclick="rotateSig(15)" style="font-size:14px;">+15°</button>
    <button class="secondary" style="padding: 5px 10px;" onclick="resetRotate()">重置</button>
  </div>
  <button class="danger" style="width: 100%;" onclick="deleteSig()">🗑️ 刪除選中簽名</button>
</div>

<div class="controls">
  <div class="section-title">💾 第三步：高畫質匯出</div>
  <div class="btn-row">
    <button class="success" style="flex: 1.5; padding: 18px;" onclick="exportFile('pdf')">📥 下載 PDF (保證不偏移)</button>
    <button style="background: #17a2b8; flex: 1; padding: 18px;" onclick="exportFile('jpg')">🖼️ 下載 JPG</button>
  </div>
</div>

<script>
const { PDFDocument } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

if (navigator.userAgent.toLowerCase().indexOf("line") !== -1) {
  const box = document.getElementById('line-alert'); box.style.display = "block";
  box.innerHTML = "⚠️ 偵測到 LINE 瀏覽器，請選「使用預設瀏覽器開啟」以確保下載正常。";
}

let signaturePad, pdfData, curP = 1, sigs = [], activeSig = null;
const spCanvas = document.getElementById('signature-pad');
let lastPadWidth = 0;

function initPad() {
  if (Math.abs(spCanvas.offsetWidth - lastPadWidth) < 10) return;
  lastPadWidth = spCanvas.offsetWidth;
  const r = window.devicePixelRatio || 1;
  const data = signaturePad ? signaturePad.toData() : null;
  spCanvas.width = spCanvas.offsetWidth * r;
  spCanvas.height = spCanvas.offsetHeight * r;
  spCanvas.getContext("2d").scale(r, r);
  signaturePad = new SignaturePad(spCanvas);
  if (data) signaturePad.fromData(data);
}
window.addEventListener("resize", initPad);
initPad();

document.getElementById('color-picker').oninput = (e) => { signaturePad.penColor = e.target.value; };

document.getElementById('pdf-upload').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const status = document.getElementById('load-status');
  const container = document.getElementById('pdf-container');
  status.textContent = "⏳ 載入中..."; container.innerHTML = '';
  sigs = []; activeSig = null;

  try {
    pdfData = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(pdfData) }).promise;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale: 1.5 });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

      const wrapper = document.createElement('div');
      wrapper.className = 'page-wrapper'; wrapper.dataset.page = i;
      wrapper.style.width = viewport.width + "px";
      wrapper.onclick = (ev) => { 
        curP = i; status.textContent = `📍 第 ${i} 頁`; ev.stopPropagation(); 
      };
      wrapper.appendChild(canvas); container.appendChild(wrapper);
    }
    status.textContent = `✅ 已載入 ${pdf.numPages} 頁`;
  } catch (err) { alert(err.message); }
};

function addSig() {
  if (signaturePad.isEmpty()) return;
  const wrapper = document.querySelector(`.page-wrapper[data-page="${curP}"]`);
  if (!wrapper) { alert("請先選取文件頁面！"); return; }

  const data = signaturePad.toDataURL();
  const img = document.createElement('img');
  img.src = data; img.className = 'signature-img';
  img.style.left = '50px'; img.style.top = '50px';
  
  const obj = { el: img, rotation: 0, width: 150, id: Date.now() };
  sigs.push(obj);
  wrapper.appendChild(img);
  selectSig(obj);

  // 互動：拖曳、滾輪、手勢縮放
  let drag = false, pinch = false, sx, sy, il, it, idist, iw;
  const getD = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

  const start = (e) => {
    selectSig(obj);
    if (e.touches && e.touches.length === 2) { pinch = true; drag = false; idist = getD(e.touches); iw = obj.width; }
    else { 
      drag = true; const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY; il = parseFloat(img.style.left); it = parseFloat(img.style.top); 
    }
    e.preventDefault(); e.stopPropagation();
  };

  const move = (e) => {
    if (pinch && e.touches.length === 2) {
      obj.width = Math.max(30, iw * (getD(e.touches) / idist));
      img.style.width = obj.width + 'px';
    } else if (drag) {
      const p = e.touches ? e.touches[0] : e;
      img.style.left = (il + p.clientX - sx) + 'px';
      img.style.top = (it + p.clientY - sy) + 'px';
    }
  };

  img.addEventListener("touchstart", start, { passive: false });
  img.addEventListener("mousedown", start);
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("mousemove", move);
  window.addEventListener("touchend", () => { drag = pinch = false; });
  window.addEventListener("mouseup", () => drag = false);
  
  img.onwheel = (e) => {
    e.preventDefault(); e.stopPropagation();
    obj.width = Math.max(30, obj.width + (e.deltaY < 0 ? 10 : -10));
    img.style.width = obj.width + 'px';
  };
}

function adjustSize(factor) { if(activeSig) { activeSig.width *= factor; activeSig.el.style.width = activeSig.width + 'px'; } }
function rotateSig(angle) { if(activeSig) { activeSig.rotation = (activeSig.rotation + angle) % 360; activeSig.el.style.transform = `rotate(${activeSig.rotation}deg)`; } }
function resetRotate() { if(activeSig) { activeSig.rotation = 0; activeSig.el.style.transform = `rotate(0deg)`; } }
function deleteSig() { if(activeSig) { activeSig.el.remove(); sigs = sigs.filter(s => s.id !== activeSig.id); activeSig = null; document.getElementById('edit-bar').style.display = 'none'; } }

function selectSig(obj) {
  document.querySelectorAll(".signature-img").forEach(el => el.classList.remove("selected"));
  activeSig = obj; obj.el.classList.add('selected');
  document.getElementById('edit-bar').style.display = 'block';
}

function deselectAll(e) {
  if (!e.target.classList.contains('signature-img') && !e.target.closest('.controls')) {
    if(activeSig) activeSig.el.classList.remove('selected');
    activeSig = null; document.getElementById('edit-bar').style.display = 'none';
  }
}

// 核心整合：採用「視覺直轉」技術，保證 100% 精準且高解析度
async function exportFile(type) {
  if (!pdfData) return;
  const status = document.getElementById('load-status');
  status.textContent = "⏳ 正在高畫質合成...";
  try {
    const finalPdf = await PDFDocument.create();
    const pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(pdfData) }).promise;

    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const wrapper = document.querySelector(`.page-wrapper[data-page="${i}"]`);
      const originalPage = await pdfDoc.getPage(i);
      
      // 關鍵：使用 3 倍縮放進行底圖渲染，確保解析度跟原版一樣清晰
      const exportScale = 3; 
      const viewport = originalPage.getViewport({ scale: exportScale });
      const offCanvas = document.createElement('canvas');
      offCanvas.width = viewport.width; offCanvas.height = viewport.height;
      const ctx = offCanvas.getContext('2d');

      // A. 繪製原始高解析度 PDF 頁面
      await originalPage.render({ canvasContext: ctx, viewport }).promise;

      // B. 繪製該頁面上的所有簽名
      const pageSigs = wrapper.querySelectorAll('.signature-img');
      const htmlToCanvasScale = viewport.width / wrapper.offsetWidth;

      for (let imgEl of pageSigs) {
        const img = new Image(); img.src = imgEl.src;
        await new Promise(res => img.onload = res);
        
        const w = parseFloat(imgEl.style.width || imgEl.offsetWidth) * htmlToCanvasScale;
        const h = imgEl.offsetHeight * htmlToCanvasScale;
        const x = parseFloat(imgEl.style.left) * htmlToCanvasScale + w/2;
        const y = parseFloat(imgEl.style.top) * htmlToCanvasScale + h/2;
        
        // 取得旋轉角度
        const rotateMatch = imgEl.style.transform.match(/rotate\((-?\d+)deg\)/);
        const rotation = rotateMatch ? parseInt(rotateMatch[1]) : 0;

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation * Math.PI / 180);
        ctx.drawImage(img, -w/2, -h/2, w, h);
        ctx.restore();
      }

      // C. 轉換為高品質 JPG 並封裝
      const imgData = offCanvas.toDataURL('image/jpeg', 0.95);
      
      if (type === 'jpg') {
        if (i === curP) { // JPG 僅匯出當前選中頁
          const link = document.createElement('a'); link.href = imgData; link.download = `Signed_Page_${i}.jpg`; link.click();
        }
      } else {
        // PDF 封裝：確保頁面尺寸與原始 PDF 完全一致
        const pdfImg = await finalPdf.embedJpg(imgData);
        const { width, height } = originalPage.getViewport({ scale: 1 });
        const newPage = finalPdf.addPage([width, height]);
        newPage.drawImage(pdfImg, { x: 0, y: 0, width, height });
      }
    }

    if (type === 'pdf') {
      const pdfBytes = await finalPdf.save();
      const blob = new Blob([pdfBytes], { type: "application/pdf" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "Signed_Final_HighRes.pdf"; link.click();
    }
    status.textContent = "✨ 匯出成功";
  } catch (err) {
    console.error(err);
    alert("處理失敗：" + err.message);
    status.textContent = "❌ 失敗";
  }
}
</script>
</body>
</html>
